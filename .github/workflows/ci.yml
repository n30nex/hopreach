name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: go test
        run: go test ./...

      - name: go build (native)
        run: go build ./...

      - name: go build (wasm)
        run: GOOS=js GOARCH=wasm go build -o /tmp/hopreach.wasm ./wasm

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - name: node --check public/*.js
        run: |
          for f in public/*.js; do
            echo "checking $f"
            node --check "$f"
          done
      - name: Install deterministic UI test browser
        run: npx playwright install --with-deps chromium
      - name: Regional controls and isolation
        run: npx playwright test --config=playwright.regions.config.js

  # Keep every tests/*.spec.js scenario, including regional isolation, and run
  # the real Go/WASM/nginx image with synthetic API + deterministic DEM input.
  # API/DEM URLs are pinned to the fixture; no production volume is mounted.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOPREACH_E2E_COMPOSE: tests/offline-fixtures/compose.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify synthetic API and terrain fixtures
        run: python3 -B -m unittest discover -s tests/offline-fixtures -p test_server.py

      - name: Build real HopReach test image
        run: docker compose -f "$HOPREACH_E2E_COMPOSE" build

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Capture fixture and pipeline logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f "$HOPREACH_E2E_COMPOSE" logs --no-color > test-results/compose.log

      - name: Remove isolated test containers and volumes
        if: always()
        run: docker compose -f "$HOPREACH_E2E_COMPOSE" down --volumes --remove-orphans

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
